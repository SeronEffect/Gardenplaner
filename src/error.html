<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Gardenplaner – Fehler %sveltekit.status%</title>
		<style>
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1411; color: #e6ede7;
				font: 15px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
			main { background: #171e19; border: 1px solid #26302a; border-radius: 10px; padding: 24px 28px; max-width: 520px; }
			h1 { font-size: 20px; margin: 0 0 8px; }
			a { color: #b5e655; }
		</style>
	</head>
	<body>
		<main>
			<h1>Gardenplaner – Fehler %sveltekit.status%</h1>
			<p>%sveltekit.error.message%</p>
			<p><a href="/">Neu laden</a></p>
		</main>
	</body>
</html>
