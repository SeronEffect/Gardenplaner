# Local development: `docker compose up -d db`
# Full stack (app + db): `docker compose up -d --build`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: garden
      POSTGRES_USER: garden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U garden -d garden']
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # Public URL of the app – baked in at build time (adapter-node 6 ignores ORIGIN at runtime)
        ORIGIN: ${ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://garden:${POSTGRES_PASSWORD}@db:5432/garden
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
